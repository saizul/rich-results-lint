name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: |
          rich-results-lint --version
          rich-results-lint --list-rules > /dev/null
          rich-results-lint --no-config examples/article-ok.html
          rich-results-lint --no-config examples/product-page.html --format sarif --fail-on never > /dev/null
          # The example page has errors on purpose: exit status 1 is expected.
          set +e; rich-results-lint --no-config examples/product-page.html; status=$?; set -e
          test "$status" -eq 1
          python examples/api_usage.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rich-results-lint:ci .
      - run: docker run --rm -v "$PWD/examples:/work" rich-results-lint:ci --no-config article-ok.html
