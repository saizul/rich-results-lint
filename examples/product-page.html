<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jamdani Saree - Example Shop</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "Handwoven Jamdani Saree",
  "image": "/images/jamdani.jpg",
  "descripton": "Traditional Dhakai jamdani, cotton.",
  "brand": {"@id": "#brand"},
  "offers": {
    "@type": "Offer",
    "price": "৳12,500",
    "priceCurrency": "Tk",
    "availability": "In Stock",
    "priceValidUntil": "2024-12-31"
  },
  "aggregateRating": {"@type": "AggregateRating", "ratingValue": "4,7"}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Sarees", "item": "https://shop.example/sarees"},
    {"@type": "ListItem", "position": 3, "name": "Jamdani"}
  ]
}
</script>
</head>
<body>
<h1>Handwoven Jamdani Saree</h1>
<p>Price: 12,500 taka</p>
</body>
</html>
