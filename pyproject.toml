[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rich-results-lint"
dynamic = ["version"]
description = "Linter for JSON-LD, Microdata and RDFa structured data: schema.org typos, ISO 8601 dates, URLs, prices, @id references and Google rich result requirements, with text, JSON and SARIF output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["structured-data", "json-ld", "schema.org", "rich-results", "seo", "technical-seo", "microdata", "rdfa", "sarif", "linter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saizul/rich-results-lint"
Issues = "https://github.com/saizul/rich-results-lint/issues"
Changelog = "https://github.com/saizul/rich-results-lint/blob/main/CHANGELOG.md"

[project.scripts]
rich-results-lint = "rich_results_lint.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rich_results_lint._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rich_results_lint = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
